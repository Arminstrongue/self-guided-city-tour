# Produção num servidor Hetzner (Ubuntu + Docker). Ver README.
# Logs com tamanho limitado (rodam sozinhos): não guardam dados pessoais por tempo indefinido.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  db:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB"]
    environment:
      POSTGRES_USER: sgct
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: sgct
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgct"]
      interval: 5s
      retries: 10

  migrate:
    logging: *logging
    build: &build_builder { context: ., target: builder, args: { NEXT_PUBLIC_ETIAS_LIVE: "${NEXT_PUBLIC_ETIAS_LIVE:-0}" } }
    env_file: .env
    environment:
      DATABASE_URL: postgres://sgct:${POSTGRES_PASSWORD}@db:5432/sgct
    command: ["npx", "tsx", "scripts/migrate.ts"]
    depends_on: { db: { condition: service_healthy } }

  # Recolhe dados novos para cada cidade (eventos, notícias, tempo, história, tendências) de 6 em 6 horas.
  worker:
    logging: *logging
    build: *build_builder
    restart: unless-stopped
    mem_limit: ${WORKER_MEM:-768m}
    env_file: .env
    environment:
      DATABASE_URL: postgres://sgct:${POSTGRES_PASSWORD}@db:5432/sgct
      DB_POOL_MAX: 3
      MEDIA_DIR: /data/media
    # Mesmo volume da app: ao limpar histórias expiradas, apaga também os vídeos e áudios do disco.
    volumes: [media:/data/media]
    command: ["npx", "tsx", "scripts/worker.ts"]
    depends_on: { db: { condition: service_healthy }, migrate: { condition: service_completed_successfully } }

  app:
    logging: *logging
    build: { context: ., target: runner, args: { NEXT_PUBLIC_ETIAS_LIVE: "${NEXT_PUBLIC_ETIAS_LIVE:-0}" } }
    restart: unless-stopped
    # Limite por réplica (a conversão de vídeos com ffmpeg não pode deixar o Postgres sem memória). Ajuste no .env.
    mem_limit: ${APP_MEM:-1536m}
    env_file: .env
    environment:
      DATABASE_URL: postgres://sgct:${POSTGRES_PASSWORD}@db:5432/sgct
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      MEDIA_DIR: /data/media
    # Vídeos enviados (partilhados por todas as réplicas da app).
    volumes: [media:/data/media]
    # Mais capacidade: docker compose up -d --scale app=3 (o Caddy distribui entre as réplicas).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    logging: *logging
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/maintenance:/srv/maintenance:ro
      - caddy_data:/data
    depends_on: [app]

volumes:
  pgdata:
  caddy_data:
  media:
