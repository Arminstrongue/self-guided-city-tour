# Produção num servidor Hetzner (Ubuntu + Docker). Ver README.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB"]
    environment:
      POSTGRES_USER: sgct
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: sgct
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgct"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: builder }
    env_file: .env
    environment:
      DATABASE_URL: postgres://sgct:${POSTGRES_PASSWORD}@db:5432/sgct
    command: ["npx", "tsx", "scripts/migrate.ts"]
    depends_on: { db: { condition: service_healthy } }

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://sgct:${POSTGRES_PASSWORD}@db:5432/sgct
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
    # Mais capacidade: docker compose up -d --scale app=3 (o Caddy distribui entre as réplicas).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

volumes:
  pgdata:
  caddy_data:
